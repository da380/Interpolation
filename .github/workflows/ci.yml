# Phase 0 safety net: the existing test suite is the behavioural oracle for
# the refactor, so it runs on every push and pull request before any header
# is touched. Phase 1 replaces this with a compiler matrix, sanitiser jobs,
# a format check and a documentation build.
name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the oracle is intact
        run: |
          count=$(ctest --test-dir build -N | sed -n 's/^Total Tests: //p')
          echo "Discovered $count tests (baseline is 34)."
          if [ "$count" -lt 34 ]; then
            echo "::error::Test count fell below the phase 0 baseline of 34."
            exit 1
          fi
